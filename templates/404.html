{% extends 'base.html' %}

{% block title %}404 Page Not Found - NoteLens{% endblock %}
{% block header_title %}Page Not Found{% endblock %}

{% block content %}
<div class="container-fluid p-0 text-center py-5">
    <div class="notelens-card p-5 d-inline-block shadow-sm" style="max-width: 550px;">
        <i class="bi bi-compass display-1 text-primary mb-3 d-block"></i>
        <h2 class="fw-bold mb-2">404 - Page Not Found</h2>
        <p class="text-muted mb-4">The page or note resource you requested could not be found.</p>
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary btn-sm px-4">
            <i class="bi bi-house-fill me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
