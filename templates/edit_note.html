{% extends 'base.html' %}

{% block title %}Edit {{ note.title }} - NoteLens{% endblock %}
{% block header_title %}Edit Note{% endblock %}

{% block content %}
<div class="container-fluid p-0">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="notelens-card p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold mb-0"><i class="bi bi-pencil-square text-primary me-2"></i>Edit Note Details</h5>
                    <a href="{{ url_for('notes.note_detail', note_id=note.id) }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
                </div>

                <form action="{{ url_for('notes.update_note', note_id=note.id) }}" method="POST">
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label class="form-label fw-bold">Note Title</label>
                            <input type="text" name="title" class="form-control" value="{{ note.title }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Subject</label>
                            <select name="subject" class="form-select">
                                {% for subj in subjects %}
                                    <option value="{{ subj }}" {% if note.subject == subj %}selected{% endif %}>{{ subj }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Topic</label>
                            <input type="text" name="topic" class="form-control" value="{{ note.topic }}" required>
                        </div>

                        <div class="col-md-12">
                            <label class="form-label fw-bold">Extracted Text</label>
                            <textarea name="extracted_text" class="form-control extracted-text-area" rows="10" required>{{ note.extracted_text }}</textarea>
                        </div>

                        <div class="col-md-12 text-end mt-4">
                            <button type="submit" class="btn btn-primary btn-lg px-5 shadow-sm">
                                <i class="bi bi-check-lg me-2"></i> Save Changes
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
